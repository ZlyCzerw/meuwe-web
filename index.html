    <noscript>
      <h1>meuwe — local events on a map</h1>
      <p>meuwe is a hyperlocal event map. Open it and immediately see what is happening around you — picnics, concerts, sports, markets and neighbourhood meetups. No ads, and no account is needed to browse.</p>
      <h2>The home screen is a map of today’s events</h2>
      <p>Every pin is a different event. Browse by date or filter the categories you care about.</p>
      <h2>One tap to join</h2>
      <p>Tap a pin to see the details — when, where and who is organising. Follow it, chat with the other attendees and stay up to date without leaving the map.</p>
      <h2>An event in 10 seconds</h2>
      <p>The title is the only required field. Everything else is optional. Your event shows up on the map instantly and anyone nearby can find it.</p>
      <h2>Private events</h2>
      <p>Invite only the people you choose — nobody else will even see that the event exists.</p>
